name: GPS recovery extended regression
on:
  push:
    branches:
      - fix/gps-integrated-stability-20261117
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/gps-recovery-extended.yml'
  pull_request:
    branches:
      - main
      - fix/gps-reception-diagnostics-20261117
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/gps-recovery-extended.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gps-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all GPS recovery and tracking regressions
        shell: bash
        run: |
          set -euo pipefail
          # Discover all GPS regression tests so newly added cases cannot be silently skipped.
          mapfile -t gps_tests < <(find tests -maxdepth 1 -type f -name 'gps-*.test.cjs' | sort)
          if [ "${#gps_tests[@]}" -eq 0 ]; then
            echo "::error::No GPS regression tests found"
            exit 1
          fi
          echo "Running ${#gps_tests[@]} GPS regression suites"
          for file in "${gps_tests[@]}"; do
            echo "::group::$file"
            node "$file"
            echo "::endgroup::"
          done
