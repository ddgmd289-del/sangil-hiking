name: Build MYHIKING Android APK
on:
  push:
    branches: [build/android-apk-20261110]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      # Preview package stays unchanged. A permanent release signing key is required for in-place updates.
      # Never store keystores or passwords in the repository.
      - name: Generate Android project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/kr/sangil/myhiking
          cp index.html extensions.js auth-config.js manifest.webmanifest service-worker.js app/src/main/assets/
          cp -r icons app/src/main/assets/
          mkdir -p app/src/main/assets/vendor
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error https://unpkg.com/leaflet@1.9.4/dist/leaflet.js -o app/src/main/assets/vendor/leaflet.js
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error https://unpkg.com/leaflet@1.9.4/dist/leaflet.css -o app/src/main/assets/vendor/leaflet.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          import re
          s=re.sub(r'<link rel="stylesheet" href="https://unpkg.com/leaflet@1\.9\.4/dist/leaflet\.css"[^>]*>', '<link rel="stylesheet" href="vendor/leaflet.css">', s)
          s=re.sub(r'<script src="https://unpkg.com/leaflet@1\.9\.4/dist/leaflet\.js"[^>]*></script>', '<script src="vendor/leaflet.js"></script>', s)
          # Avoid waiting for remote Firebase scripts when map initializes.
          s=re.sub(r'<script src="https://www\.gstatic\.com/firebasejs/[^"]+"[^>]*></script>', '', s)
          assert 'href="vendor/leaflet.css"' in s, 'Leaflet CSS not localized'
          assert 'src="vendor/leaflet.js"' in s, 'Leaflet JS not localized'
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/index.html').read_text()
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          for i,script in enumerate(scripts):
              if script.strip():
                  Path(f'/tmp/sangil-inline-{i}.js').write_text(script)
          PY
          for js in /tmp/sangil-inline-*.js app/src/main/assets/extensions.js app/src/main/assets/auth-config.js; do
            node --check "$js"
          done
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SangilMYHIKING"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "kr.sangil.myhiking"
              compileSdk = 35
              defaultConfig { applicationId = "kr.sangil.myhiking.preview"; minSdk = 26; targetSdk = 35; versionCode = (System.getenv("GITHUB_RUN_NUMBER")?.toIntOrNull() ?: 1); versionName = "1.2.${System.getenv("GITHUB_RUN_NUMBER") ?: "0"}-preview" }
              signingConfigs {
                  create("stableRelease") {
                      storeFile = file("release-upload.jks")
                      storePassword = System.getenv("SANGIL_KEYSTORE_PASSWORD") ?: ""
                      keyAlias = System.getenv("SANGIL_KEY_ALIAS") ?: ""
                      keyPassword = System.getenv("SANGIL_KEY_PASSWORD") ?: ""
                  }
              }
              buildTypes { release { isMinifyEnabled = false; signingConfig = signingConfigs.getByName("stableRelease") } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="산길 MYHIKING 미리보기" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <service android:name=".TrackingService" android:exported="false" android:foregroundServiceType="location"/>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/kr/sangil/myhiking/MainActivity.kt <<'EOF'
          package kr.sangil.myhiking
          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import android.speech.tts.TextToSpeech
          import java.util.Locale
          class MainActivity : Activity() {
              private lateinit var web: WebView
              private var speech: TextToSpeech? = null
              private val receiver = object : android.content.BroadcastReceiver() {
                  override fun onReceive(context: android.content.Context?, intent: Intent?) {
                      val lat = intent?.getDoubleExtra("lat", Double.NaN) ?: return
                      val lon = intent.getDoubleExtra("lon", Double.NaN)
                      val alt = intent.getDoubleExtra("alt", Double.NaN)
                      val acc = intent.getFloatExtra("acc", 0f)
                      val t = intent.getLongExtra("t", System.currentTimeMillis())
                      if (!lat.isNaN() && !lon.isNaN()) web.evaluateJavascript("window.sangilNativeFix?.($lat,$lon,$alt,$acc,$t)", null)
                  }
              }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  speech = TextToSpeech(this) { if (it == TextToSpeech.SUCCESS) speech?.language = Locale.KOREAN }
                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.allowFileAccess = true
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onConsoleMessage(message: android.webkit.ConsoleMessage?): Boolean {
                          if (message?.messageLevel() == android.webkit.ConsoleMessage.MessageLevel.ERROR) {
                              android.util.Log.e("SANGIL_WEB", "${message.message()} at ${message.sourceId()}:${message.lineNumber()}")
                          }
                          return super.onConsoleMessage(message)
                      }
                  }
                  web.webViewClient = WebViewClient()
                  web.addJavascriptInterface(Bridge(), "SangilNative")
                  web.addJavascriptInterface(Bridge(), "SangilAndroid")
                  setContentView(web)
                  web.loadUrl("file:///android_asset/index.html")
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION, Manifest.permission.POST_NOTIFICATIONS), 10)
                  else requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION), 10)
              }
              inner class Bridge {
                  @JavascriptInterface fun startTracking() { runOnUiThread {
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          Toast.makeText(this@MainActivity, "위치 권한을 허용해 주세요", Toast.LENGTH_LONG).show()
                          return@runOnUiThread
                      }
                      try { val i = Intent(this@MainActivity, TrackingService::class.java).setAction("START"); startForegroundService(i) }
                      catch (e: Exception) { Toast.makeText(this@MainActivity, "GPS 시작 실패: " + e.message, Toast.LENGTH_LONG).show() }
                  } }
                  @JavascriptInterface fun pauseTracking() { runOnUiThread { startService(Intent(this@MainActivity, TrackingService::class.java).setAction("PAUSE")) } }
                  @JavascriptInterface fun resumeTracking() { startTracking() }
                  @JavascriptInterface fun requestPermission() { runOnUiThread { requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION), 10) } }
                  @JavascriptInterface fun closeApp() { runOnUiThread { finish() } }
                  @JavascriptInterface fun stopTracking() { runOnUiThread { stopService(Intent(this@MainActivity, TrackingService::class.java)) } }
                  @JavascriptInterface fun speak(text: String) { runOnUiThread { speech?.apply { setSpeechRate(0.90f); speak(text, TextToSpeech.QUEUE_FLUSH, null, "sangil") } } }
                  @JavascriptInterface fun getTrackBackup(): String {
                      val f = java.io.File(filesDir, "tracking_backup.jsonl")
                      return if (f.exists()) f.readText() else ""
                  }
              }
              override fun onStart() { super.onStart(); val filter = android.content.IntentFilter("kr.sangil.myhiking.FIX"); if (Build.VERSION.SDK_INT >= 33) registerReceiver(receiver, filter, android.content.Context.RECEIVER_NOT_EXPORTED) else registerReceiver(receiver, filter) }
              override fun onStop() { unregisterReceiver(receiver); super.onStop() }
              override fun onDestroy() { speech?.shutdown(); web.destroy(); super.onDestroy() }
          }
          EOF
          cat > app/src/main/java/kr/sangil/myhiking/TrackingService.kt <<'EOF'
          package kr.sangil.myhiking
          import android.Manifest
          import android.app.*
          import android.content.pm.PackageManager
          import android.content.*
          import android.location.*
          import android.os.*
          import org.json.JSONObject
          class TrackingService : Service(), LocationListener {
              private lateinit var location: LocationManager
              override fun onBind(intent: Intent?): IBinder? = null
              override fun onCreate() {
                  super.onCreate()
                  location = getSystemService(LOCATION_SERVICE) as LocationManager
                  val channel = NotificationChannel("hiking", "산길 GPS 산행 기록", NotificationManager.IMPORTANCE_LOW)
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(channel)
              }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") { stopSelf(); return START_NOT_STICKY }
                  if (intent?.action == "PAUSE") { try { location.removeUpdates(this) } catch (_: Exception) {}; return START_STICKY }
                  val notification = Notification.Builder(this, "hiking").setContentTitle("산길 MYHIKING").setContentText("산행 위치 기록 중").setSmallIcon(android.R.drawable.ic_menu_mylocation).build()
                  startForeground(101, notification)
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                      try {
                          location.removeUpdates(this)
                          // Network fixes provide a fast initial position indoors; GPS refines it outdoors.
                          for (provider in listOf(LocationManager.NETWORK_PROVIDER, LocationManager.GPS_PROVIDER)) {
                              if (location.isProviderEnabled(provider)) {
                                  location.getLastKnownLocation(provider)?.let { onLocationChanged(it) }
                                  location.requestLocationUpdates(provider, 2000L, 1f, this)
                              }
                          }
                      } catch (e: Exception) { android.util.Log.e("SANGIL_GPS", "Location registration failed", e) }
                  }
                  return START_STICKY
              }
              override fun onLocationChanged(loc: Location) {
                  val p = JSONObject().put("lat", loc.latitude).put("lng", loc.longitude).put("time", System.currentTimeMillis())
                  java.io.File(filesDir, "tracking_backup.jsonl").appendText(p.toString() + "\n")
                  sendBroadcast(Intent("kr.sangil.myhiking.FIX").setPackage(packageName).putExtra("lat",loc.latitude).putExtra("lon",loc.longitude).putExtra("alt",loc.altitude).putExtra("acc",loc.accuracy).putExtra("t",System.currentTimeMillis()))
              }
              override fun onDestroy() { try { location.removeUpdates(this) } catch (_: Exception) {}; super.onDestroy() }
          }
          EOF
      - name: Build debug APK (temporary signing, not upgrade-safe)
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SANGIL-MYHIKING-DEBUG-REINSTALL-REQUIRED
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Configure permanent signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SANGIL_KEYSTORE_BASE64 }}
          SANGIL_KEYSTORE_PASSWORD: ${{ secrets.SANGIL_KEYSTORE_PASSWORD }}
          SANGIL_KEY_ALIAS: ${{ secrets.SANGIL_KEY_ALIAS }}
          SANGIL_KEY_PASSWORD: ${{ secrets.SANGIL_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$SANGIL_KEYSTORE_PASSWORD" ] || [ -z "$SANGIL_KEY_ALIAS" ] || [ -z "$SANGIL_KEY_PASSWORD" ]; then
            echo "Permanent signing secrets not configured; signed upgrade APK skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > app/release-upload.jks; then
            echo "::error::KEYSTORE_BASE64_INVALID: Recheck SANGIL_KEYSTORE_BASE64 contents."
            exit 1
          fi
          if ! keytool -list -keystore app/release-upload.jks -storepass "$SANGIL_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::KEYSTORE_OR_PASSWORD_INVALID: Check that Base64 was generated from sangil-myhiking-final.jks and that SANGIL_KEYSTORE_PASSWORD is its password."
            exit 1
          fi
          # Resolve the actual private-key alias from the validated keystore.
          # This avoids an accidental typo in the alias secret without exposing key material.
          ACTUAL_ALIASES=$(LC_ALL=C keytool -list -keystore app/release-upload.jks -storepass "$SANGIL_KEYSTORE_PASSWORD" 2>/dev/null | awk -F, '/PrivateKeyEntry/{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1}')
          ALIAS_COUNT=$(printf '%s\n' "$ACTUAL_ALIASES" | sed '/^$/d' | wc -l)
          if [ "$ALIAS_COUNT" -ne 1 ]; then
            echo "::error::KEY_ALIAS_AMBIGUOUS: Expected exactly one private key entry in the keystore."
            exit 1
          fi
          ACTUAL_ALIAS=$(printf '%s\n' "$ACTUAL_ALIASES" | head -n 1)
          if [ "$SANGIL_KEY_ALIAS" != "$ACTUAL_ALIAS" ]; then
            echo "::warning::Configured key alias differs from the keystore; using the sole private-key alias."
          fi
          echo "SANGIL_KEY_ALIAS=$ACTUAL_ALIAS" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Build signed update APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          SANGIL_KEYSTORE_PASSWORD: ${{ secrets.SANGIL_KEYSTORE_PASSWORD }}
          SANGIL_KEY_PASSWORD: ${{ secrets.SANGIL_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signed APK and package metadata
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          echo "Signed update APK verified successfully."
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: SANGIL-MYHIKING-SIGNED-UPDATE-APK
          path: app/build/outputs/apk/release/app-release.apk
