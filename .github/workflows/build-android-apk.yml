name: Build MYHIKING Android APK
on:
  push:
    branches: [build/android-apk-20261110, fix/gps-track-stability-20261113, feature/google-play-aab-20261113, fix/gps-route-gaps-20261114, fix/gps-distance-integrity-20261115, fix/gps-gap-reacquisition-20261116, feature/record-summary-accuracy-20261116, fix/saved-route-gpx-segments-20261116, fix/clear-previous-route-on-new-activity-20261116, fix/walking-time-autopause-accuracy-20261116, fix/gps-track-recovery-consistency-20261116, fix/notification-open-app-20261116, feature/tranggle-style-activity-map-20261116, fix/delete-record-clears-map-20261117, fix/gps-live-route-stability-20261117, fix/pace-time-consistency-20261117, fix/gps-zero-distance-20261117, fix/gps-reception-diagnostics-20261117, fix/gps-integrated-stability-20261117]
  pull_request:
    branches: [main, fix/gps-reception-diagnostics-20261117]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify source revision and app identity
        run: |
          echo "Build source: $GITHUB_SHA ($GITHUB_REF_NAME)"
          echo 'NOTE: This workflow builds kr.sangil.myhiking.preview; do not label it as an update for a differently identified installed app.'
      - name: Verify GPS regression checks
        run: |
          set -euo pipefail
          mapfile -t gps_tests < <(find tests -maxdepth 1 -type f -name 'gps-*.test.cjs' | sort)
          if [ "${#gps_tests[@]}" -eq 0 ]; then
            echo "::error::No GPS regression tests found"
            exit 1
          fi
          for file in "${gps_tests[@]}"; do
            node "$file"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      # Preview package stays unchanged. A permanent release signing key is required for in-place updates.
      # Never store keystores or passwords in the repository.
      - name: Generate Android project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/kr/sangil/myhiking
          cp index.html extensions.js auth-config.js manifest.webmanifest service-worker.js app/src/main/assets/
          cmp -s index.html app/src/main/assets/index.html || { echo 'ERROR: bundled index.html differs from source'; exit 1; }
          # Embed the exact source revision and Actions run in the packaged WebView.
          # This identifies a stale APK without clearing any user activity data.
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          html = p.read_text(encoding='utf-8')
          revision = os.environ.get('GITHUB_SHA', 'unknown')[:8]
          run = os.environ.get('GITHUB_RUN_NUMBER', 'local')
          marker = '<div id="sangil-build-id" style="position:relative;text-align:center;padding:6px 10px;font-size:11px;opacity:.65" aria-label="앱 빌드 식별자">앱 빌드 '+run+' · '+revision+'</div>'
          if '</body>' not in html:
              raise SystemExit('Missing HTML body; cannot stamp build')
          html = html.replace('</body>', marker+'\\n</body>', 1)
          p.write_text(html, encoding='utf-8')
          print('Embedded build marker:', run, revision)
          PY
          printf 'source_commit=%s\nsource_ref=%s\nbuild_run=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > app/src/main/assets/build-info.txt
          cp -r icons app/src/main/assets/
          mkdir -p app/src/main/res/drawable
          python3 -m pip install --quiet cairosvg
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='android-launcher-icon.svg',write_to='app/src/main/res/drawable/sangil_launcher.png',output_width=512,output_height=512)
          PY
          mkdir -p app/src/main/assets/vendor
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error https://unpkg.com/leaflet@1.9.4/dist/leaflet.js -o app/src/main/assets/vendor/leaflet.js
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error https://unpkg.com/leaflet@1.9.4/dist/leaflet.css -o app/src/main/assets/vendor/leaflet.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          import re
          s=re.sub(r'<link rel="stylesheet" href="https://unpkg.com/leaflet@1\.9\.4/dist/leaflet\.css"[^>]*>', '<link rel="stylesheet" href="vendor/leaflet.css">', s)
          s=re.sub(r'<script src="https://unpkg.com/leaflet@1\.9\.4/dist/leaflet\.js"[^>]*></script>', '<script src="vendor/leaflet.js"></script>', s)
          # Avoid waiting for remote Firebase scripts when map initializes.
          s=re.sub(r'<script src="https://www\.gstatic\.com/firebasejs/[^"]+"[^>]*></script>', '', s)
          assert 'href="vendor/leaflet.css"' in s, 'Leaflet CSS not localized'
          assert 'src="vendor/leaflet.js"' in s, 'Leaflet JS not localized'
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          for i,script in enumerate(scripts):
              if script.strip():
                  Path(f'/tmp/sangil-inline-{i}.js').write_text(script)
          PY
          for js in /tmp/sangil-inline-*.js app/src/main/assets/extensions.js app/src/main/assets/auth-config.js; do
            node --check "$js"
          done
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SangilMYHIKING"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "kr.sangil.myhiking"
              compileSdk = 35
              defaultConfig { applicationId = "kr.sangil.myhiking.preview"; minSdk = 26; targetSdk = 35; versionCode = (System.getenv("GITHUB_RUN_NUMBER")?.toIntOrNull() ?: 1); versionName = "1.2.${System.getenv("GITHUB_RUN_NUMBER") ?: "0"}-preview" }
              signingConfigs {
                  create("stableRelease") {
                      storeFile = file("release-upload.jks")
                      storePassword = System.getenv("SANGIL_KEYSTORE_PASSWORD") ?: ""
                      keyAlias = System.getenv("SANGIL_KEY_ALIAS") ?: ""
                      keyPassword = System.getenv("SANGIL_KEYSTORE_PASSWORD") ?: "" // PKCS12 key password equals store password
                  }
              }
              buildTypes { release { isMinifyEnabled = false; signingConfig = signingConfigs.getByName("stableRelease") } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("androidx.core:core:1.15.0") }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="산길 트레킹" android:icon="@drawable/sangil_launcher" android:roundIcon="@drawable/sangil_launcher" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                      <intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="sangil" android:host="home"/></intent-filter>
                  </activity>
                  <service android:name=".TrackingService" android:exported="false" android:foregroundServiceType="location"/>
                  <provider android:name="androidx.core.content.FileProvider" android:authorities="kr.sangil.myhiking.preview.share" android:exported="false" android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/share_paths"/>
                  </provider>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/share_paths.xml <<'EOF'
          <paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="shared" path="shared/"/></paths>
          EOF
          cat > app/src/main/java/kr/sangil/myhiking/MainActivity.kt <<'EOF'
          package kr.sangil.myhiking
          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import android.speech.tts.TextToSpeech
          import android.util.Base64
          import androidx.core.content.FileProvider
          import java.util.Locale
          class MainActivity : Activity() {
              private lateinit var web: WebView
              private var speech: TextToSpeech? = null
              private var startAfterPermission = false
              private val stepManager by lazy { getSystemService(SENSOR_SERVICE) as android.hardware.SensorManager }
              private val stepSensor by lazy { stepManager.getDefaultSensor(android.hardware.Sensor.TYPE_STEP_COUNTER) }
              private var stepListening = false
              private fun calculateSteps(previous: Long, sameDay: Boolean, sameBoot: Boolean, last: Long, count: Long): Long {
                  return previous + if (sameDay && sameBoot && last >= 0L && count >= last) count - last else 0L
              }
              private val stepListener = object : android.hardware.SensorEventListener {
                  override fun onAccuracyChanged(sensor: android.hardware.Sensor?, accuracy: Int) {}
                  override fun onSensorChanged(event: android.hardware.SensorEvent) {
                      val raw = event.values.firstOrNull() ?: return
                      if (!raw.isFinite() || raw < 0f) return
                      val count = raw.toLong()
                      val day = java.text.SimpleDateFormat("yyyy-MM-dd", Locale.US).format(java.util.Date())
                      val prefs = getSharedPreferences("sangil_steps", MODE_PRIVATE)
                      val last = prefs.getLong("last", -1L)
                      val sameDay = prefs.getString("day", "") == day
                      val previous = if (sameDay) prefs.getLong("total", 0L) else 0L
                      val boot = android.provider.Settings.Global.getInt(contentResolver, "boot_count", -1)
                      val lastBoot = prefs.getInt("boot", -1)
                      val sameBoot = boot >= 0 && lastBoot == boot
                      val total = calculateSteps(previous, sameDay, sameBoot, last, count)
                      prefs.edit().putString("day", day).putLong("last", count).putLong("total", total).putInt("boot", boot).apply()
                      web.evaluateJavascript("window.sangilStepUpdate?.($total)", null)
                  }
              }
              private fun startSteps() {
                  if (stepListening || stepSensor == null) return
                  if (Build.VERSION.SDK_INT >= 29 && checkSelfPermission(Manifest.permission.ACTIVITY_RECOGNITION) != PackageManager.PERMISSION_GRANTED) return
                  stepListening = stepManager.registerListener(stepListener, stepSensor, android.hardware.SensorManager.SENSOR_DELAY_NORMAL)
              }
              override fun onResume() { super.onResume(); startSteps() }
              // Keep the listener while the activity exists, including screen-off pauses. Android may suspend delivery in background.
              override fun onPause() { super.onPause() }

              private val gpsErrorReceiver = object : android.content.BroadcastReceiver() {
                  override fun onReceive(context: android.content.Context?, intent: Intent?) {
                      val reason = intent?.getStringExtra("reason") ?: return
                      web.evaluateJavascript("document.getElementById('gpsStatus').textContent=" + org.json.JSONObject.quote(reason), null)
                  }
              }
              private val receiver = object : android.content.BroadcastReceiver() {
                  override fun onReceive(context: android.content.Context?, intent: Intent?) {
                      val lat = intent?.getDoubleExtra("lat", Double.NaN) ?: return
                      val lon = intent.getDoubleExtra("lon", Double.NaN)
                      val alt = intent.getDoubleExtra("alt", Double.NaN)
                      val acc = intent.getFloatExtra("acc", 0f)
                      val t = intent.getLongExtra("t", System.currentTimeMillis())
                      if (!lat.isNaN() && !lon.isNaN()) web.evaluateJavascript("window.sangilNativeFix?.($lat,$lon,$alt,$acc,$t)", null)
                  }
              }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  speech = TextToSpeech(this) { if (it == TextToSpeech.SUCCESS) speech?.language = Locale.KOREAN }
                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.allowFileAccess = true
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onConsoleMessage(message: android.webkit.ConsoleMessage?): Boolean {
                          if (message?.messageLevel() == android.webkit.ConsoleMessage.MessageLevel.ERROR) {
                              android.util.Log.e("SANGIL_WEB", "${message.message()} at ${message.sourceId()}:${message.lineNumber()}")
                          }
                          return super.onConsoleMessage(message)
                      }
                  }
                  web.webViewClient = WebViewClient()
                  web.addJavascriptInterface(Bridge(), "SangilNative")
                  web.addJavascriptInterface(Bridge(), "SangilAndroid")
                  setContentView(web)
                  web.loadUrl("file:///android_asset/index.html")
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION, Manifest.permission.POST_NOTIFICATIONS), 10)
                  else requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION), 10)
              }
              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  if (intent.action == Intent.ACTION_VIEW && intent.data?.scheme == "sangil" && intent.data?.host == "home") {
                      web.loadUrl("file:///android_asset/index.html")
                  }
              }
              inner class Bridge {
                  @JavascriptInterface fun deleteStepData(): Boolean {
                      return try {
                          getSharedPreferences("sangil_steps", MODE_PRIVATE).edit().clear().commit()
                      } catch (e: Exception) { false }
                  }
                  @JavascriptInterface fun savedSteps(): String {
                      val prefs = getSharedPreferences("sangil_steps", MODE_PRIVATE)
                      val day = java.text.SimpleDateFormat("yyyy-MM-dd", Locale.US).format(java.util.Date())
                      val allowed = Build.VERSION.SDK_INT < 29 || checkSelfPermission(Manifest.permission.ACTIVITY_RECOGNITION) == PackageManager.PERMISSION_GRANTED
                      return org.json.JSONObject().put("available", stepSensor != null).put("allowed", allowed).put("count", if (prefs.getString("day", "") == day) prefs.getLong("total", 0L) else 0L).toString()
                  }
                  @JavascriptInterface fun enableSteps() { runOnUiThread {
                      if (stepSensor == null) { web.evaluateJavascript("window.sangilStepStatus?.('걸음수 센서 없음')", null); return@runOnUiThread }
                      if (Build.VERSION.SDK_INT >= 29 && checkSelfPermission(Manifest.permission.ACTIVITY_RECOGNITION) != PackageManager.PERMISSION_GRANTED) requestPermissions(arrayOf(Manifest.permission.ACTIVITY_RECOGNITION), 21)
                      else startSteps()
                  } }

                  @JavascriptInterface fun resolveLocality(lat: Double, lon: Double): String {
                      if (!lat.isFinite() || !lon.isFinite() || lat !in -90.0..90.0 || lon !in -180.0..180.0 || (lat == 0.0 && lon == 0.0)) return ""
                      return try {
                          if (!android.location.Geocoder.isPresent()) return ""
                          val task = java.util.concurrent.FutureTask<String> {
                              val a = android.location.Geocoder(this@MainActivity, Locale.KOREAN).getFromLocation(lat, lon, 1)?.firstOrNull()
                              if (a == null) "" else listOfNotNull(a.adminArea, a.locality, a.subLocality, a.thoroughfare?.takeIf { it.endsWith("동") || it.endsWith("읍") || it.endsWith("면") }).flatMap { it.trim().split(Regex("\\s+")) }.filter { it.isNotBlank() }.distinct().joinToString(" ")
                          }
                          Thread(task, "sangil-locality").apply { isDaemon = true }.start()
                          try { task.get(3, java.util.concurrent.TimeUnit.SECONDS) } finally { task.cancel(true) }
                      } catch (e: Exception) { "" }
                  }
                  @JavascriptInterface fun openExam(url: String) { runOnUiThread {
                      try {
                          val uri = android.net.Uri.parse(url)
                          if (uri.scheme != "https" || uri.host != "script.google.com" ||
                              !uri.path.orEmpty().startsWith("/macros/s/") ||
                              !uri.path.orEmpty().endsWith("/exec")) {
                              Toast.makeText(this@MainActivity, "시험 주소가 올바르지 않습니다.", Toast.LENGTH_LONG).show()
                              return@runOnUiThread
                          }
                          startActivity(Intent(Intent.ACTION_VIEW, uri).addCategory(Intent.CATEGORY_BROWSABLE))
                      } catch (e: Exception) {
                          Toast.makeText(this@MainActivity, "시험 화면을 열지 못했습니다.", Toast.LENGTH_LONG).show()
                      }
                  } }
                  @JavascriptInterface fun startTracking() { runOnUiThread {
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          Toast.makeText(this@MainActivity, "위치 권한 요청 중 · 허용 후 GPS 기록이 시작됩니다", Toast.LENGTH_LONG).show()
                          startAfterPermission = true
                          requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION), 10)
                          return@runOnUiThread
                      }
                      try { val i = Intent(this@MainActivity, TrackingService::class.java).setAction("START"); startForegroundService(i) }
                      catch (e: Exception) { Toast.makeText(this@MainActivity, "GPS 시작 실패: " + e.message, Toast.LENGTH_LONG).show() }
                  } }
                  @JavascriptInterface fun pauseTracking() { runOnUiThread { startService(Intent(this@MainActivity, TrackingService::class.java).setAction("PAUSE")) } }
                  @JavascriptInterface fun resumeTracking() { startTracking() }
                  @JavascriptInterface fun requestPermission() { runOnUiThread { requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION), 10) } }
                  @JavascriptInterface fun closeApp() { runOnUiThread { finish() } }
                  @JavascriptInterface fun stopTracking() { runOnUiThread { stopService(Intent(this@MainActivity, TrackingService::class.java)) } }
                  @JavascriptInterface fun speak(text: String) { runOnUiThread { speech?.apply { setSpeechRate(0.90f); speak(text, TextToSpeech.QUEUE_FLUSH, null, "sangil") } } }
                  @JavascriptInterface fun shareText(text: String) { runOnUiThread {
                      try {
                          val intent = Intent(Intent.ACTION_SEND).apply { type = "text/plain"; putExtra(Intent.EXTRA_TEXT, text) }
                          startActivity(Intent.createChooser(intent, "지도 위치 공유"))
                      } catch (e: Exception) { Toast.makeText(this@MainActivity, "공유 실패: " + e.message, Toast.LENGTH_LONG).show() }
                  } }
                  @JavascriptInterface fun shareImage(dataUrl: String) { runOnUiThread {
                      try {
                          val encoded = dataUrl.substringAfter("base64,", "")
                          require(encoded.isNotBlank() && encoded.length < 20000000) { "이미지 데이터 오류" }
                          val bytes = Base64.decode(encoded, Base64.DEFAULT)
                          val dir = java.io.File(cacheDir, "shared").apply { mkdirs() }
                          val file = java.io.File(dir, "sangil_hike.png")
                          file.writeBytes(bytes)
                          val uri = FileProvider.getUriForFile(this@MainActivity, "kr.sangil.myhiking.preview.share", file)
                          val intent = Intent(Intent.ACTION_SEND).apply {
                              type = "image/png"
                              putExtra(Intent.EXTRA_STREAM, uri)
                              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              clipData = android.content.ClipData.newRawUri("산행 결과", uri)
                          }
                          startActivity(Intent.createChooser(intent, "산행 결과 공유"))
                      } catch (e: Exception) { Toast.makeText(this@MainActivity, "이미지 공유 실패: " + e.message, Toast.LENGTH_LONG).show() }
                  } }
                  @JavascriptInterface fun getGpsDiagnostics(): String {
                      val prefs = getSharedPreferences("sangil_gps", MODE_PRIVATE)
                      val o = org.json.JSONObject()
                      o.put("finePermission", checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED)
                      o.put("lastFixTime", prefs.getLong("lastFixTime", 0L))
                      o.put("lastAccuracy", prefs.getFloat("lastAccuracy", -1f).toDouble())
                      o.put("lastProvider", prefs.getString("lastProvider", ""))
                      o.put("serviceStarted", prefs.getLong("serviceStarted", 0L))
                      o.put("serviceError", prefs.getString("serviceError", ""))
                      val manager = getSystemService(LOCATION_SERVICE) as android.location.LocationManager
                      o.put("gpsEnabled", manager.isProviderEnabled(android.location.LocationManager.GPS_PROVIDER))
                      o.put("networkEnabled", manager.isProviderEnabled(android.location.LocationManager.NETWORK_PROVIDER))
                      return o.toString()
                  }
                                    @JavascriptInterface fun getTrackBackup(): String {
                      val f = java.io.File(filesDir, "tracking_backup.jsonl")
                      return if (f.exists()) f.readText(Charsets.UTF_8) else ""
                  }
              }
              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 21) { startSteps(); web.evaluateJavascript("window.sangilRefreshSteps?.()", null); return }
                  if (requestCode != 10) return
                  val shouldStart = startAfterPermission
                  startAfterPermission = false
                  if (shouldStart && checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                      try { startForegroundService(Intent(this, TrackingService::class.java).setAction("START")) }
                      catch (e: Exception) { Toast.makeText(this, "GPS 시작 실패: " + e.message, Toast.LENGTH_LONG).show() }
                  } else if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, "정확한 위치 권한이 필요합니다. 설정에서 위치 권한을 허용해 주세요.", Toast.LENGTH_LONG).show()
                  }
              }
              override fun onStart() { super.onStart(); val filter = android.content.IntentFilter("kr.sangil.myhiking.FIX"); val errors = android.content.IntentFilter("kr.sangil.myhiking.GPS_ERROR"); if (Build.VERSION.SDK_INT >= 33) { registerReceiver(receiver, filter, android.content.Context.RECEIVER_NOT_EXPORTED); registerReceiver(gpsErrorReceiver, errors, android.content.Context.RECEIVER_NOT_EXPORTED) } else { registerReceiver(receiver, filter); registerReceiver(gpsErrorReceiver, errors) } }
              override fun onStop() { unregisterReceiver(receiver); unregisterReceiver(gpsErrorReceiver); super.onStop() }
              override fun onDestroy() { stepManager.unregisterListener(stepListener); stepListening = false; speech?.shutdown(); web.destroy(); super.onDestroy() }
          }
          EOF
          cat > app/src/main/java/kr/sangil/myhiking/TrackingService.kt <<'EOF'
          package kr.sangil.myhiking
          import android.Manifest
          import android.app.*
          import android.content.pm.PackageManager
          import android.content.*
          import android.location.*
          import android.os.*
          import org.json.JSONObject
          class TrackingService : Service(), LocationListener {
              private lateinit var location: LocationManager
              override fun onBind(intent: Intent?): IBinder? = null
              override fun onCreate() {
                  super.onCreate()
                  location = getSystemService(LOCATION_SERVICE) as LocationManager
                  val channel = NotificationChannel("hiking", "산길 트레킹 GPS 기록", NotificationManager.IMPORTANCE_LOW)
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(channel)
              }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent == null) { stopSelf(); return START_NOT_STICKY }
                  if (intent.action == "STOP") { stopSelf(); return START_NOT_STICKY }
                  if (intent?.action == "PAUSE") { try { location.removeUpdates(this) } catch (_: Exception) {}; return START_NOT_STICKY }
                  // Tapping the ongoing GPS notification returns to the existing activity.
                  val openApp = Intent(this, MainActivity::class.java).apply {
                      addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                  }
                  val openPendingIntent = PendingIntent.getActivity(this, 0, openApp, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val notification = Notification.Builder(this, "hiking")
                      .setContentTitle("산길 트레킹")
                      .setContentText("산행 위치 기록 중 · 눌러서 앱 열기")
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setContentIntent(openPendingIntent)
                      .setAutoCancel(false)
                      .build()
                  startForeground(101, notification)
                  getSharedPreferences("sangil_gps", MODE_PRIVATE).edit().putLong("serviceStarted", System.currentTimeMillis()).putString("error", "").apply()
                  getSharedPreferences("sangil_gps", MODE_PRIVATE).edit().putLong("serviceStarted", System.currentTimeMillis()).putString("serviceError", "").apply()
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                      try {
                          location.removeUpdates(this)
                          // Network fixes provide a fast initial position indoors; GPS refines it outdoors.
                          var registered = false
                          for (provider in listOf(LocationManager.NETWORK_PROVIDER, LocationManager.GPS_PROVIDER)) {
                              try {
                                  if (location.isProviderEnabled(provider)) {
                                      location.getLastKnownLocation(provider)?.let { onLocationChanged(it) }
                                      location.requestLocationUpdates(provider, 2000L, 1f, this)
                                      registered = true
                                  }
                              } catch (e: Exception) { android.util.Log.w("SANGIL_GPS", "Provider unavailable: " + provider, e) }
                          }
                          if (!registered) { getSharedPreferences("sangil_gps", MODE_PRIVATE).edit().putString("serviceError","GPS 제공자 사용 불가").apply(); sendBroadcast(Intent("kr.sangil.myhiking.GPS_ERROR").setPackage(packageName).putExtra("reason","GPS 제공자 사용 불가 · 휴대폰 위치 서비스를 켜 주세요")) }

                      } catch (e: Exception) { getSharedPreferences("sangil_gps", MODE_PRIVATE).edit().putString("serviceError",e.message ?: "GPS 등록 오류").apply(); android.util.Log.e("SANGIL_GPS", "Location registration failed", e) }
                  }
                  // Do not silently restart a stopped or paused hike after process death.
                  return START_NOT_STICKY
              }
              override fun onLocationChanged(loc: Location) {
                  // Reject cached/stale fixes; never relabel old positions with the current time.
                  val fixTime = loc.time
                  val now = System.currentTimeMillis()
                  if (fixTime <= 0L || fixTime > now + 5000L || now - fixTime > 30000L || !loc.hasAccuracy() || !loc.accuracy.isFinite() || loc.accuracy < 0f || loc.accuracy > 300f || !loc.latitude.isFinite() || !loc.longitude.isFinite() || kotlin.math.abs(loc.latitude) > 90.0 || kotlin.math.abs(loc.longitude) > 180.0 || (loc.latitude == 0.0 && loc.longitude == 0.0)) return
                  getSharedPreferences("sangil_gps", MODE_PRIVATE).edit()
                      .putLong("lastFixTime", fixTime).putFloat("lastAccuracy", loc.accuracy)
                      .putString("lastProvider", loc.provider ?: "").apply()
                  getSharedPreferences("sangil_gps", MODE_PRIVATE).edit().putLong("lastFix", now).putFloat("accuracy", loc.accuracy).putString("provider", loc.provider ?: "").apply()
                  val p = JSONObject().put("lat", loc.latitude).put("lng", loc.longitude).put("time", fixTime)
                      .put("accuracy", loc.accuracy).put("alt", if (loc.hasAltitude()) loc.altitude else 0.0)
                  try { java.io.File(filesDir, "tracking_backup.jsonl").appendText(p.toString() + System.lineSeparator()) }
                  catch (e: Exception) { android.util.Log.w("SANGIL_GPS", "Backup write failed", e) }
                  sendBroadcast(Intent("kr.sangil.myhiking.FIX").setPackage(packageName)
                      .putExtra("lat",loc.latitude).putExtra("lon",loc.longitude)
                      .putExtra("alt",if (loc.hasAltitude()) loc.altitude else 0.0)
                      .putExtra("acc",loc.accuracy).putExtra("t",fixTime))
              }
              override fun onDestroy() { try { location.removeUpdates(this) } catch (_: Exception) {}; super.onDestroy() }
          }
          EOF
      - name: Verify native step counter lifecycle and storage wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app/src/main/java/kr/sangil/myhiking/MainActivity.kt').read_text()
          assert 'TYPE_STEP_COUNTER' in src
          assert 'sameDay && sameBoot && last >= 0L && count >= last' in src
          assert 'if (sameDay) prefs.getLong("total", 0L) else 0L' in src
          assert 'putInt("boot", boot)' in src
          assert 'if (stepListening || stepSensor == null) return' in src
          assert 'override fun onPause() { super.onPause() }' in src
          assert 'override fun onDestroy() { stepManager.unregisterListener(stepListener)' in src
          assert 'fun deleteStepData(): Boolean' in src
          assert 'val total = calculateSteps(previous, sameDay, sameBoot, last, count)' in src
          print('Native step counter wiring checks passed')
          PY
      - name: Execute production step calculation regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path('app/src/main/java/kr/sangil/myhiking/MainActivity.kt').read_text()
          fn = re.search(r'private fun calculateSteps\([^\n]+\n[^\n]+\n\s*\}', src)
          assert fn
          Path('/tmp/StepRegression.kt').write_text(fn.group(0) + """
          fun main() {
              check(calculateSteps(0, true, true, -1, 500) == 0L)
              check(calculateSteps(100, true, true, 500, 520) == 120L)
              check(calculateSteps(100, true, true, 520, 520) == 100L)
              check(calculateSteps(100, true, false, 520, 900) == 100L)
              check(calculateSteps(100, true, true, 520, 10) == 100L)
              check(calculateSteps(0, false, true, 520, 900) == 0L)
              println("Step calculation regression passed")
          }
          """)
          PY
          kotlinc /tmp/StepRegression.kt -include-runtime -d /tmp/StepRegression.jar
          java -jar /tmp/StepRegression.jar
      - name: Verify permission grant never starts an unrequested trip
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app/src/main/java/kr/sangil/myhiking/MainActivity.kt').read_text()
          assert 'private var startAfterPermission = false' in src
          assert 'startAfterPermission = true' in src
          assert 'val shouldStart = startAfterPermission' in src
          assert 'startAfterPermission = false' in src
          assert 'if (shouldStart && checkSelfPermission' in src
          # The initial onCreate permission request must not set the start flag.
          on_create = src.split('override fun onCreate(savedInstanceState:', 1)[1].split('override fun onNewIntent', 1)[0]
          assert 'startAfterPermission = true' not in on_create
          # A permission request from the settings/diagnostics bridge must not start tracking.
          request = src.split('@JavascriptInterface fun requestPermission()', 1)[1].split('@JavascriptInterface fun closeApp()', 1)[0]
          assert 'startAfterPermission = true' not in request
          print('Permission/start regression checks passed')
          PY
      - name: Build debug APK (temporary signing, not upgrade-safe)
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SANGIL-MYHIKING-DEBUG-REINSTALL-REQUIRED
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Configure permanent signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SANGIL_KEYSTORE_BASE64 }}
          SANGIL_KEYSTORE_PASSWORD: ${{ secrets.SANGIL_KEYSTORE_PASSWORD }}
          SANGIL_KEY_ALIAS: ${{ secrets.SANGIL_KEY_ALIAS }}
          SANGIL_KEY_PASSWORD: ${{ secrets.SANGIL_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$SANGIL_KEYSTORE_PASSWORD" ] || [ -z "$SANGIL_KEY_ALIAS" ] || [ -z "$SANGIL_KEY_PASSWORD" ]; then
            echo "Permanent signing secrets not configured; signed upgrade APK skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > app/release-upload.jks; then
            echo "::error::KEYSTORE_BASE64_INVALID: Recheck SANGIL_KEYSTORE_BASE64 contents."
            exit 1
          fi
          if ! keytool -list -keystore app/release-upload.jks -storepass "$SANGIL_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::KEYSTORE_OR_PASSWORD_INVALID: Check that Base64 was generated from sangil-myhiking-final.jks and that SANGIL_KEYSTORE_PASSWORD is its password."
            exit 1
          fi
          # Resolve the actual private-key alias from the validated keystore.
          # This avoids an accidental typo in the alias secret without exposing key material.
          ACTUAL_ALIASES=$(LC_ALL=C keytool -list -keystore app/release-upload.jks -storepass "$SANGIL_KEYSTORE_PASSWORD" 2>/dev/null | awk -F, '/PrivateKeyEntry/{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1}')
          ALIAS_COUNT=$(printf '%s\n' "$ACTUAL_ALIASES" | sed '/^$/d' | wc -l)
          if [ "$ALIAS_COUNT" -ne 1 ]; then
            echo "::error::KEY_ALIAS_AMBIGUOUS: Expected exactly one private key entry in the keystore."
            exit 1
          fi
          ACTUAL_ALIAS=$(printf '%s\n' "$ACTUAL_ALIASES" | head -n 1)
          if [ "$SANGIL_KEY_ALIAS" != "$ACTUAL_ALIAS" ]; then
            echo "::warning::Configured key alias differs from the keystore; using the sole private-key alias."
          fi
          # Verify private-key password before running Gradle, without printing secrets.
          if ! keytool -certreq -alias "$ACTUAL_ALIAS" -keystore app/release-upload.jks -storepass "$SANGIL_KEYSTORE_PASSWORD" -keypass "$SANGIL_KEYSTORE_PASSWORD" -file /tmp/sangil-signing-check.csr >/dev/null 2>&1; then
            echo "::error::KEY_PASSWORD_INVALID: The PKCS12 private key cannot be unlocked using SANGIL_KEYSTORE_PASSWORD."
            exit 1
          fi
          rm -f /tmp/sangil-signing-check.csr
          echo "SANGIL_KEY_ALIAS=$ACTUAL_ALIAS" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Build signed update APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          SANGIL_KEYSTORE_PASSWORD: ${{ secrets.SANGIL_KEYSTORE_PASSWORD }}
          SANGIL_KEY_PASSWORD: ${{ secrets.SANGIL_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Android package identity and version
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          tools=sorted(Path(os.environ['ANDROID_HOME'],'build-tools').glob('*/aapt'),key=lambda p:[int(x) for x in re.findall(r'\d+',p.parent.name)])
          if not tools: raise SystemExit('Android aapt not found')
          for flavor in ('debug','release'):
              apk=Path(f'app/build/outputs/apk/{flavor}/app-{flavor}.apk')
              if not apk.exists():
                  if flavor=='release': continue
                  raise SystemExit('Missing debug APK')
              info=subprocess.check_output([str(tools[-1]),'dump','badging',str(apk)],text=True)
              package=re.search(r"package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'",info)
              if not package: raise SystemExit(f'{apk}: cannot read package metadata')
              app_id,code,name=package.groups()
              if app_id!='kr.sangil.myhiking.preview':
                  raise SystemExit(f'{apk}: unexpected package {app_id}')
              if int(code)<1: raise SystemExit(f'{apk}: invalid versionCode')
              print(f'{apk}: package={app_id}, versionCode={code}, versionName={name}; preview only, NOT proven compatible with existing app')
          PY
      - name: Verify every APK signature and report signer fingerprints
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          for flavor in debug release; do
            APK="app/build/outputs/apk/$flavor/app-$flavor.apk"
            if [ ! -f "$APK" ]; then
              if [ "$flavor" = debug ]; then echo "::error::Missing debug APK"; exit 1; fi
              echo "Release APK not built; permanent signing configuration may be absent."
              continue
            fi
            "$APKSIGNER" verify --verbose --print-certs "$APK" | grep -E 'Verified|Signer #1 certificate SHA-256 digest'
            echo "Signature verified for $flavor. Compare the SHA-256 signer digest with the currently installed APK before any in-place update."
          done
      - name: Publish APK provenance and signing fingerprints
        run: |
          set -euo pipefail
          mkdir -p apk-verification
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          printf 'source_commit=%s\nsource_ref=%s\nworkflow_run=%s\npackage_id=kr.sangil.myhiking.preview\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > apk-verification/verification.txt
          for flavor in debug release; do
            APK="app/build/outputs/apk/$flavor/app-$flavor.apk"
            [ -f "$APK" ] || continue
            echo "artifact=$flavor" >> apk-verification/verification.txt
            sha256sum "$APK" >> apk-verification/verification.txt
            # Capture the verified signer details separately for each APK.
            CERTS=$("$APKSIGNER" verify --verbose --print-certs "$APK")
            printf '%s\n' "$CERTS" >> apk-verification/verification.txt
            # apksigner output varies by Android build-tools version. A missing
            # printable digest is a provenance gap, not a failed v2 signature.
            # Preserve the complete verification output and flag the gap.
            if ! printf '%s\n' "$CERTS" | grep -Eiq 'certificate SHA-256 digest[[:space:]]*:'; then
              echo "::warning::Signer SHA-256 digest not printed for $flavor; compare signing certificates independently before updating an installed app."
              echo "signer_fingerprint_status=$flavor:NOT_AVAILABLE_DO_NOT_ASSUME_UPDATE_COMPATIBILITY" >> apk-verification/verification.txt
            fi
          done
          echo 'WARNING: This report does not prove installed-app signing compatibility or data preservation.' >> apk-verification/verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SANGIL-APK-IDENTITY-AND-SIGNING-REPORT
          path: apk-verification/verification.txt
      - name: Verify packaged web assets and revision
        run: |
          python3 - <<'PY'
          import os, zipfile, hashlib
          from pathlib import Path
          for flavor in ('debug','release'):
              apk=Path(f'app/build/outputs/apk/{flavor}/app-{flavor}.apk')
              if not apk.exists():
                  if flavor == 'release': continue
                  raise SystemExit('Missing debug APK')
              with zipfile.ZipFile(apk) as z:
                  for filename in ('index.html','build-info.txt'):
                      name='assets/'+filename
                      if name not in z.namelist():
                          raise SystemExit(f'{apk}: missing {name}')
                      packaged=z.read(name)
                      source=Path('app/src/main/assets',filename).read_bytes()
                      if hashlib.sha256(packaged).digest()!=hashlib.sha256(source).digest():
                          raise SystemExit(f'{apk}: {name} differs from built source')
                  info=z.read('assets/build-info.txt').decode()
                  if 'source_commit='+os.environ['GITHUB_SHA'] not in info:
                      raise SystemExit(f'{apk}: incorrect source commit')
              print(f'{apk}: bundled web assets and source revision verified')
          PY
      - name: Verify signed APK and package metadata
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          echo "Signed preview APK signature verified. Compatibility with installed apps NOT verified."
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: SANGIL-MYHIKING-SIGNED-PREVIEW-APK-NOT-VERIFIED-AS-UPDATE
          path: app/build/outputs/apk/release/app-release.apk
      - name: Build signed Android App Bundle (Play preparation)
        if: steps.signing.outputs.enabled == 'true'
        env:
          SANGIL_KEYSTORE_PASSWORD: ${{ secrets.SANGIL_KEYSTORE_PASSWORD }}
          SANGIL_KEY_PASSWORD: ${{ secrets.SANGIL_KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease
      - name: Verify release AAB exists
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify "$AAB"
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          with zipfile.ZipFile('app/build/outputs/bundle/release/app-release.aab') as z:
              for filename in ('index.html','build-info.txt','auth-config.js'):
                  assert z.read('base/assets/'+filename)==Path('app/src/main/assets',filename).read_bytes(), filename
              assert ('source_commit='+os.environ['GITHUB_SHA']).encode() in z.read('base/assets/build-info.txt')
              assert 'base/manifest/AndroidManifest.xml' in z.namelist()
          print('AAB assets and source revision verified; PREVIEW ONLY, NOT FOR PLAY SUBMISSION')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: SANGIL-GOOGLE-PLAY-AAB-PREVIEW-NOT-FOR-SUBMISSION
          path: app/build/outputs/bundle/release/app-release.aab
